<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FF Cache Aim Patcher</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #238636;
      --accent-h: #2ea043;
      --danger: #da3633;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .sub { color: var(--muted); font-size: 0.875rem; margin-bottom: 2rem; }
    .drop {
      width: 100%;
      max-width: 480px;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: var(--card);
    }
    .drop.dragover { border-color: var(--accent); background: #0d2818; }
    .drop p { color: var(--muted); margin-top: 0.5rem; font-size: 0.875rem; }
    #fileName { margin-top: 1rem; font-size: 0.8rem; color: var(--accent); word-break: break-all; }
    .modes {
      display: none;
      width: 100%;
      max-width: 480px;
      margin-top: 1.5rem;
      gap: 0.75rem;
      flex-direction: column;
    }
    .modes.show { display: flex; }
    .mode-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 1rem 1.25rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
    }
    .mode-btn:hover { border-color: var(--accent); background: #0d2818; }
    .mode-btn span { display: block; font-size: 0.75rem; font-weight: 400; color: var(--muted); margin-top: 0.25rem; }
    .status {
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--muted);
      min-height: 1.25rem;
    }
    .status.ok { color: var(--accent); }
    .status.err { color: var(--danger); }
    footer { margin-top: auto; padding-top: 3rem; font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <h1>FF Cache Aim Patcher</h1>
  <p class="sub">Drop file cache → chọn mode → tải file đã patch</p>

  <div class="drop" id="dropZone">
    <strong>Kéo thả file cache vào đây</strong>
    <p>hoặc bấm để chọn</p>
    <input type="file" id="fileInput" hidden />
    <div id="fileName"></div>
  </div>

  <div class="modes" id="modes">
    <button class="mode-btn" data-mode="lock">
      Aim Lock
      <span>bone_Head → bone_Head (giữ nguyên / lock cứng)</span>
    </button>
    <button class="mode-btn" data-mode="neck">
      Aim Neck
      <span>bone_Head → bone_Neck</span>
    </button>
    <button class="mode-btn" data-mode="drag">
      Aim Drag
      <span>bone_Head → bone_Spine / drag trajectory</span>
    </button>
    <button class="mode-btn" data-mode="body">
      Aim Body
      <span>bone_Head → bone_Hips</span>
    </button>
  </div>

  <div class="status" id="status"></div>
  <footer>Client-side only · file không upload lên server</footer>

  <script src="patcher.js"></script>
</body>
</html>
